name: UEFI firmware - EDK2 multi-platform build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: false

env:
  PROJECT_URL: https://github.com/pftf/RPi4
  RPI_FIRMWARE_URL: https://github.com/raspberrypi/firmware/
  ARCH: AARCH64
  COMPILER: GCC5
  GCC5_AARCH64_PREFIX: aarch64-linux-gnu-
  # The following should usually be set to 'master' but, in case
  # of a regression, a specific SHA-1 can be specified.
  START_ELF_VERSION: master
  # Set to pre HDMI/Audio changes per https://github.com/pftf/RPi4/issues/252
  DTB_VERSION: b49983637106e5fb33e2ae60d8c15a53187541e4
  DTBO_VERSION: master

jobs:
  UEFI-Build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [3, 4, 5]

    steps:
      - name: Set version
        id: set_version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Check out EDK2 repositories
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache permissions
        run: |
          sudo chown $(id -un) /var/cache/apt/archives

      - name: Cache packages
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y -o Acquire::Retries=50 \
                            acpica-tools mtools syslinux isolinux gcc-aarch64-linux-gnu uuid-dev

      - name: Set up Git environment
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git config --global push.default simple
          git config --global core.autocrlf false

      - name: Build UEFI firmware for RPi${{ matrix.model }}
        run: |
          VERSION=${{ inputs.version || steps.set_version.outputs.version }} MODEL=${{ matrix.model }} make

      - name: Upload UEFI firmware artifacts for RPi${{ matrix.model }}
        uses: actions/upload-artifact@v4
        with:
          name: RPi${{ matrix.model }} UEFI Firmware ${{ inputs.version || steps.set_version.outputs.version }}
          path: |
            Build/RPi${{ matrix.model }}/**/FV/RPI_EFI.fd

      - name: Display SHA-256 for RPi${{ matrix.model }}
        run: sha256sum Build/RPi${{ matrix.model }}/*/FV/RPI_EFI.fd

  Create-Release:
    runs-on: ubuntu-latest
    needs: UEFI-Build

    steps:
      - name: Set version
        id: set_version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y acpica-tools mtools syslinux isolinux gcc-aarch64-linux-gnu uuid-dev zip

      - name: Set up Git environment
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create multi-platform archive
        run: |
          VERSION=${{ inputs.version || steps.set_version.outputs.version }} make build-archive-all

      - name: Display SHA-256
        run: sha256sum Build/RPi*_UEFI_Firmware_${{ inputs.version || steps.set_version.outputs.version }}.zip

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Raspberry Pi 3/4/5 UEFI Firmware ${{ inputs.version || steps.set_version.outputs.version }}

            This release includes UEFI firmware for:
            - Raspberry Pi 3 (RPI3_EFI.fd)
            - Raspberry Pi 4 (RPI4_EFI.fd)
            - Raspberry Pi 5 (RPI5_EFI.fd)

            The config.txt file will automatically select the correct firmware based on your Raspberry Pi model.
          tag_name: ${{ inputs.version || steps.set_version.outputs.version }}
          files: |
            Build/RPi*_UEFI_Firmware_${{ inputs.version || steps.set_version.outputs.version }}.zip
